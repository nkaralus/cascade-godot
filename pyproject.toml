[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade-godot"
version = "0.2.0"
description = "Journaled, engine-verified, rollback-safe execution of validated Mule frames against a Godot 4 project."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["engine-telemetry-bus>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest", "mule-protocol>=0.2.0"]

[project.scripts]
cascade-godot = "cascade_godot.__main__:main"

[tool.setuptools]
packages = ["cascade_godot"]

[tool.setuptools.package-data]
cascade_godot = ["scripts/*.gd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["godot: needs a real Godot 4.3 binary (set GODOT_BIN)"]
